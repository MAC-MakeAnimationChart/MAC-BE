spring:
  # DB/테이블은 개발자가 직접 SQL로 관리한다. 앱은 스키마를 생성·변경하지 않는다.
  flyway:
    enabled: false
  sql:
    init:
      mode: never
  application:
    name: mac-studio-backend
  profiles:
    # Local MySQL settings live in gitignored application-local.yml.
    # Production will use AWS RDS with a separately configured explicit profile.
    default: local
  jpa:
    properties:
      hibernate.jdbc.time_zone: UTC
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    issuer: ${JWT_ISSUER:mac-studio}
    audience: ${JWT_AUDIENCE:mac-studio-api}
    secret-base64: ${JWT_SECRET_BASE64:}
  storage:
    enabled: ${S3_ENABLED:false}
    bucket: ${S3_BUCKET:}
    region: ${AWS_REGION:ap-northeast-2}
  limits:
    guest-upload-bytes: 5242880
    member-upload-bytes: 10485760
    member-storage-bytes: 31457280
  auth:
    hmac-secret-base64: ${AUTH_HMAC_SECRET_BASE64:}
    mail-from: ${MAIL_FROM:}
    policy:
      # 개발용 기본값. 운영 정책과 실제 약관 버전은 배포 전 별도 확정한다.
      access-ttl-seconds: 600
      refresh-ttl-seconds: ${AUTH_REFRESH_TTL_SECONDS:604800}
      family-ttl-seconds: ${AUTH_FAMILY_TTL_SECONDS:2592000}
      password-min-length: ${AUTH_PASSWORD_MIN_LENGTH:8}
      terms-version: ${AUTH_TERMS_VERSION:v1}
      privacy-version: ${AUTH_PRIVACY_VERSION:v1}
      sends-per-hour: ${AUTH_EMAIL_SENDS_PER_HOUR:5}
      secure-cookie: ${AUTH_SECURE_COOKIE:true}
    email:
      # 아래 기본값은 로컬 개발용 제안값이며 운영 확정값이 아니다.
      code-length: ${AUTH_EMAIL_CODE_LENGTH:6}
      code-ttl-seconds: ${AUTH_EMAIL_CODE_TTL_SECONDS:300}
      proof-ttl-seconds: ${AUTH_EMAIL_PROOF_TTL_SECONDS:600}
      max-attempts: ${AUTH_EMAIL_MAX_ATTEMPTS:5}
      resend-after-seconds: ${AUTH_EMAIL_RESEND_AFTER_SECONDS:60}
    social:
      signup-ttl-seconds: ${AUTH_SOCIAL_SIGNUP_TTL_SECONDS:600}
      reauth-ttl-seconds: ${AUTH_SOCIAL_REAUTH_TTL_SECONDS:300}
      google:
        client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
        client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
        token-uri: https://oauth2.googleapis.com/token
        user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
        redirect-uris: ${GOOGLE_OAUTH_REDIRECT_URIS:http://localhost:3000/auth/callback/google}
      kakao:
        client-id: ${KAKAO_OAUTH_CLIENT_ID:}
        client-secret: ${KAKAO_OAUTH_CLIENT_SECRET:}
        token-uri: https://kauth.kakao.com/oauth/token
        user-info-uri: https://kapi.kakao.com/v2/user/me
        redirect-uris: ${KAKAO_OAUTH_REDIRECT_URIS:http://localhost:3000/auth/callback/kakao}
      naver:
        client-id: ${NAVER_OAUTH_CLIENT_ID:}
        client-secret: ${NAVER_OAUTH_CLIENT_SECRET:}
        token-uri: https://nid.naver.com/oauth2.0/token
        user-info-uri: https://openapi.naver.com/v1/nid/me
        redirect-uris: ${NAVER_OAUTH_REDIRECT_URIS:http://localhost:3000/auth/callback/naver}
logging:
  level:
    # UNIQUE 위반 로그에 이메일 등 입력값이 포함되지 않게 한다.
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF
